<template>
    <lightning-card title="Case Workbench" icon-name="standard:case">
        <div class="slds-p-around_medium">
            <lightning-input type="text" label="Passenger Record ID" placeholder="Enter Passenger Record ID"
                value={passengerId} onchange={handlePassengerChange}>
            </lightning-input>

            <lightning-input class="slds-m-top_medium" type="text" label="Booking Reference"
                placeholder="Enter Booking Number" value={bookingReference} onchange={handleBookingReferenceChange}>
            </lightning-input>

            <lightning-combobox class="slds-m-top_medium" label="Issue Category" value={issueCategory}
                options={issueCategoryOptions} onchange={handleIssueCategoryChange}>
            </lightning-combobox>

            <lightning-input class="slds-m-top_medium" type="text" label="Subject" value={subject}
                onchange={handleSubjectChange}>
            </lightning-input>

            <lightning-textarea class="slds-m-top_medium" label="Description" value={description}
                onchange={handleDescriptionChange}>
            </lightning-textarea>

            <div class="slds-m-top_large slds-text-align_center">

                <lightning-button variant="brand" label="Create Case" onclick={handleCreateCase}>
                </lightning-button>

            </div>

            <template if:true={successMessage}>
                <div class="success-message slds-m-top_medium">
                    {successMessage}
                </div>
            </template>

            <template if:true={errorMessage}>
                <div class="error-message slds-m-top_medium">
                    {errorMessage}
                </div>
            </template>

        </div>

    </lightning-card>
</template>
